name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend  # ← todos los pasos corren aquí

    strategy:
      matrix:
        node-version: [20.x]  # 20 LTS es suficiente; 18 llega a EOL en 2025

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json  # ← ruta correcta

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test --if-present  # --if-present evita error si no hay script test aún
        env:
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
